# @package _global_

defaults:
- override /data: difix3d_training
- override /model: difix3d
- override /trainer: swapfix_training
- override /callbacks: default
- override /logger: wandb
- _self_
task_name: seamfix
name: seamfix
exp_suffix: ''
train: true
test: false
predict: false
ckpt_path: null
data:
  train_pairs_yaml: ${oc.env:AVATARMIX_DATA_ROOT,../data}/thuman2_avatarrex/pairs/train.yaml
  val_pairs_yaml: ${oc.env:AVATARMIX_DATA_ROOT,../data}/thuman2_avatarrex/pairs/val.yaml
  test_pairs_yaml: null
  exclude_pair_ids: null
  val_include_only_pair_ids: null
  test_include_only_pair_ids: null
  test_camera_filter: null
  test_output_root: ${oc.env:AVATARMIX_DATA_ROOT,../data}/thuman2_avatarrex/seamfix_outputs
  strict_mode: false
  combined_data_root: ${oc.env:AVATARMIX_DATA_ROOT,../data}/thuman2_avatarrex/head_swapped_back_renders
  validation_data_root: ${oc.env:AVATARMIX_DATA_ROOT,../data}/thuman2_avatarrex/head_swapped_renders
  validation_neck_mode: union
  skip_validation: false
  skip_missing_validation: true
  validation_source: first_swap
  first_swap_dir_filter: from_point_cloud
  training_neck_mode: both
  both_mode_swapped_ratio: 0.6
  both_mode_random_seed: 42
  both_mode_max_oversampling: 3.0
  batch_size: 1
  prompts: remove degradation
  validate_gt_existence: true
  target_resolution: 512
  enable_rotation_aug: true
  rotation_degrees:
  - -45
  - 45
  rotation_prob: 0.7
  refinement_mode: partial
  gt_dataset_root: ${oc.env:AVATARMIX_DATA_ROOT,../data}/thuman2_avatarrex
model:
  training_mode: true
  validation:
    partial_refinement:
      neck_color:
      - 85
      - 51
      - 0
      hair_color:
      - 255
      - 0
      - 0
      color_tolerance_validation: 5
      dilate_neck: true
      neck_dilation_kernel_size: 7
      dilate_hair: false
      hair_dilation_kernel_size: 3
  training:
    partial_refinement:
      enabled: true
      neck_color:
      - 85
      - 51
      - 0
      hair_color:
      - 255
      - 0
      - 0
      color_tolerance: 5
      dilate_neck: true
      neck_dilation_kernel_size: 7
      dilate_hair: false
      hair_dilation_kernel_size: 3
      log_training_images_freq: 0.1
      max_training_images: 1
      log_training_error_images: true
      skip_validation: false
    identity:
      enabled: false
    unet_lora:
      enabled: true
      rank: 8
      alpha: 8.0
      dropout: 0.1
      target_modules:
      - to_k
      - to_q
      - to_v
      - to_out.0
    swapfix_lora:
      enabled: true
      rank: 4
      alpha: 4.0
      dropout: 0.1
    lora_training_mode: combined
    difix_weight: 0.5
    swapfix_weight: 0.5
    loss_weights:
      l2_weight: 1.0
      lpips_weight: 1.0
      gram_weight: 0.5
    optimizer:
      learning_rate: 5e-4
      weight_decay: 0.01
      use_cosine_scheduler: true
      scheduler_eta_min: 1e-6
trainer:
  max_epochs: 10
  precision: bf16
  check_val_every_n_epoch: 1
  limit_val_batches: 1.0
  num_sanity_val_steps: 2
  devices: 1
  num_nodes: 1
tags:
- avatarmix
- seamfix
callbacks:
  model_checkpoint:
    monitor: train_loss
    mode: min
    save_top_k: 3
    save_last: true
logger:
  name: seamfix
  offline: true
wandb:
  local: false
  offline: true
seed: 42
