[project]
name = "difix3d"
version = "0.1.0"
description = "AvatarMix SeamFix and FullbodyFix diffusion refiners"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "setuptools",
    "pytorch3d",
    "torchmetrics",
    "wandb",
    "imageio[ffmpeg]",
    "einops",
    "lpips",
    "xformers==0.0.31.post1",
    "peft==0.9.0",
    "diffusers==0.25.1",
    "huggingface-hub==0.25.1",
    "transformers==4.38.0",
    "triton; sys_platform == 'linux'",
    "triton-windows<3.4; sys_platform == 'win32'",
    "loguru>=0.7.0",
    "pytest>=7.0.0",
    "lightning>=2.0.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "rootutils>=1.0.7",
    "rich>=13.0.0",
    "pyrootutils>=1.0.4",
    "datasets>=2.14.0",
    "accelerate>=0.24.0",
    "open_clip_torch",
    "opencv-python",
    "tensorboard",
    "psutil",
]

[build-system]
requires = ["setuptools", "wheel", "pip"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]
torchvision = [
    { index = "pytorch-cu128" },
]
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git", rev = "cbcae096a0b9b04f7c515d11bb4285a82e96b8d7" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
no-build-isolation-package = ["pytorch3d"]
