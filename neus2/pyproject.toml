[project]
name = "neus2"
version = "0.1.0"
description = "NeuS2: Neural Surface Reconstruction from Multi-view Images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "commentjson~=0.9.0",
    "imageio~=2.16.0",
    "numpy~=1.21.2",
    "pybind11~=2.7.1",
    "scipy~=1.7.1",
    "tqdm~=4.62.2",
    "opencv-python~=4.5.5.62",
    "trimesh",
    "tensorboard",
    "pytorch3d",
    "termcolor",
]

[tool.setuptools]
py-modules = []

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]
torchvision = [
    { index = "pytorch-cu128" },
]
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git", rev = "cbcae096a0b9b04f7c515d11bb4285a82e96b8d7" }

[tool.uv]
no-build-isolation-package = ["pytorch3d"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
