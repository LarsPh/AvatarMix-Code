[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swapvton"
version = "0.1.0"
description = "AvatarMix composition and data preparation pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2.6",
    "opencv-python>=4.11.0.86",
    "pillow>=11.2.1",
    "tqdm>=4.67.1",
    "trimesh[all]==4.6.10",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "plyfile>=1.1",
    "polyscope>=2.3.0",
    "setuptools",
    "pytorch3d",
    "pyyaml",
    "debugpy",
    "loguru",
    "pymeshlab>=2023.12.post1",
    "transformers",
    "rembg[gpu]",
    "scipy",
    "omegaconf",
    "imageio[ffmpeg]",
    "reshape_ops",
    "ultralytics",
]

[tool.uv.sources]
torch = [ { index = "pytorch-cu128" } ]
torchvision = [ { index = "pytorch-cu128" } ]
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git", rev = "cbcae096a0b9b04f7c515d11bb4285a82e96b8d7" }
reshape_ops = { path = "../splatting/model/reshaping/reshape_ops" }
[tool.uv]
no-build-isolation-package = ["pytorch3d","reshape_ops"]

[tool.setuptools]
py-modules = []

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.basedpyright]
executionEnvironments = [
  { root = ".", extraPaths = [".", "./src"] },
]
